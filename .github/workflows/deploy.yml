name: CI and Deploy Dormitory Chatbot

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bot
        run: npm run verify

  deploy:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Execute deployment script on remote server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/Dormitory-chatbot-monthly-payment
            
            # Get the latest code from the main branch
            git fetch origin
            
            # Reset local changes and update to the latest code
            git reset --hard origin/main
            
            # Install production dependencies exactly from package-lock.json
            npm ci --omit=dev
            
            # Restart bot
            pm2 reload Dormitory-chatbot-monthly-payment --update-env || pm2 start src/index.js --name Dormitory-chatbot-monthly-payment
            pm2 save
